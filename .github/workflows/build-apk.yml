name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Garde la même clé de signature d'un build à l'autre : sinon Android refuse
      # d'installer la nouvelle version par-dessus l'ancienne. La clé n'existe que dans
      # le cache GitHub Actions ; elle est créée au premier build sur main.
      - name: Restaurer la clé de signature
        uses: actions/cache@v4
        with:
          path: ~/manhwa-signing/release.jks
          key: manhwa-signing-key-v1

      - name: Créer la clé de signature si besoin
        run: |
          if [ ! -f ~/manhwa-signing/release.jks ]; then
            mkdir -p ~/manhwa-signing
            keytool -genkeypair -keystore ~/manhwa-signing/release.jks -alias manhwa \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Manhwa Calendar"
          fi
          echo "MANHWA_KEYSTORE=$HOME/manhwa-signing/release.jks" >> "$GITHUB_ENV"

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construire l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ManhwaCalendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaCalendar-apk
          path: ManhwaCalendar.apk

      # Publie l'APK de main dans une release « latest » pour un téléchargement direct depuis le téléphone.
      - name: Publier la release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Manhwa Calendar (dernière version)
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: ManhwaCalendar.apk
