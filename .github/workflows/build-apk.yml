name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Garde la même clé de signature d'un build à l'autre : sinon Android refuse
      # d'installer la nouvelle version par-dessus l'ancienne.
      - name: Restaurer la clé de signature
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construire l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ManhwaCalendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaCalendar-apk
          path: ManhwaCalendar.apk

      # Publie l'APK dans une release « latest » pour un téléchargement direct depuis le téléphone.
      - name: Publier la release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Manhwa Calendar (dernière version)
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: ManhwaCalendar.apk
